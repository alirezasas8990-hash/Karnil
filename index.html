<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کارنیل | نمونه نمایشی فروشگاه پوشاک زنانه و بچگانه</title>
<meta name="description" content="نمونه نمایشی فروشگاه اینترنتی کارنیل، پوشاک زنانه و بچگانه">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8b2f5f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👗%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#8b2f5f;--p2:#b8527f;--bg:#fbf7f5;--card:#fff;--tx:#2a1f26;--mu:#7a6b73;--br:#eadfe3;--ac:#e8a33d;--ok:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171216;--card:#231b21;--tx:#f3eaef;--mu:#a898a1;--br:#3a2d36;--p:#d27aa6;--p2:#e59ac0}}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px;line-height:1.7}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--br);display:flex;gap:10px;align-items:center;padding:10px 14px}
.logo{font-weight:800;font-size:22px;color:var(--p);cursor:pointer;letter-spacing:1px}
.sr{flex:1;border:1px solid var(--br);background:var(--bg);border-radius:12px;padding:8px 12px;min-width:0}
.ib{position:relative;background:none;border:0;font-size:20px;cursor:pointer}
.ib i{position:absolute;top:-4px;left:-6px;background:var(--p);color:#fff;border-radius:9px;font-size:11px;padding:0 5px;font-style:normal}
main{max-width:1100px;margin:auto;padding:14px}
h2{font-size:18px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2 a{font-size:13px;color:var(--p);cursor:pointer;font-weight:400}
.ban{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory}
.ban>div{flex:0 0 92%;scroll-snap-align:center;border-radius:20px;padding:26px 22px;color:#fff;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:6px;cursor:pointer}
.ban h1{font-size:24px;font-weight:800}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-weight:600}
.btn.o{background:none;color:var(--p);border:1px solid var(--p)}
.btn.w{background:#fff;color:var(--p);align-self:flex-start}
.btn:disabled{opacity:.5}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{border-radius:16px;padding:22px 12px;text-align:center;font-weight:700;cursor:pointer;background:var(--card);border:1px solid var(--br)}
.cat b{display:block;font-size:34px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0001}
.im{aspect-ratio:1/1.1;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative}
.bd{position:absolute;top:8px;right:8px;background:#d6334f;color:#fff;font-size:12px;border-radius:8px;padding:0 8px}
.ci{padding:10px}
.nm{font-size:14px;font-weight:600}
.pr{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.pr b{color:var(--p)}.pr s{color:var(--mu);font-size:12px}
.dots{display:flex;gap:4px;margin-top:4px}.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--br)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.feat div{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:12px;font-size:13px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{border:1px solid var(--br);background:var(--card);border-radius:20px;padding:4px 14px;cursor:pointer;white-space:nowrap;font-size:13px}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.box{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:16px;margin-bottom:12px}
.pd{display:grid;gap:16px}
.pd .im{border-radius:18px;font-size:120px;aspect-ratio:1/1}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;border:2px solid var(--br);margin-left:8px;cursor:pointer}
.sw.on{outline:2px solid var(--p);outline-offset:2px}
.inp{width:100%;border:1px solid var(--br);background:var(--bg);border-radius:10px;padding:10px;margin:4px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ci2{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--br)}
.ci2 .im{width:70px;height:70px;font-size:34px;border-radius:12px;flex:none;aspect-ratio:auto}
.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--br);background:var(--bg);cursor:pointer}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{flex:1;text-align:center;padding:6px;border-radius:10px;background:var(--br);font-size:12px}
.steps .on{background:var(--p);color:#fff}
.note{background:#e8a33d22;border:1px dashed var(--ac);border-radius:12px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.tl{border-right:3px solid var(--br);padding-right:16px;margin-right:8px}
.tl div{position:relative;padding:6px 0;color:var(--mu)}
.tl div:before{content:"";position:absolute;right:-24px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--br)}
.tl .d{color:var(--tx)}.tl .d:before{background:var(--ok)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st div{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:12px}
.st b{font-size:18px;color:var(--p);display:block}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars i{flex:1;background:linear-gradient(var(--p2),var(--p));border-radius:6px 6px 0 0}
.scr{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px;border-bottom:1px solid var(--br);text-align:right;white-space:nowrap}
nav.bn{position:fixed;bottom:0;right:0;left:0;background:var(--card);border-top:1px solid var(--br);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bn a{text-align:center;font-size:11px;color:var(--mu);cursor:pointer;flex:1}
nav.bn a b{display:block;font-size:20px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:24px 0}
footer a{color:var(--p);cursor:pointer}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.cats{grid-template-columns:repeat(4,1fr)}.feat{grid-template-columns:repeat(4,1fr)}.ban>div{flex-basis:48%}.pd{grid-template-columns:1fr 1fr}.st{grid-template-columns:repeat(4,1fr)}nav.bn{display:none}body{padding-bottom:0}}
</style>
</head>
<body>
<header>
 <div class="logo" onclick="go('home')">کارنیل</div>
 <input class="sr" id="q" placeholder="جست‌وجوی محصول..." onkeydown="if(event.key==='Enter'){S.q=this.value;S.f.cat='all';go('list')}">
 <button class="ib" onclick="go('cart')" aria-label="سبد خرید">🛍<i id="cc">۰</i></button>
 <button class="ib" onclick="go('auth')" aria-label="حساب کاربری">👤</button>
</header>
<div class="note" style="margin:0;border-radius:0;text-align:center;border-width:0 0 1px">این سایت یک نمونه نمایشی است؛ پرداخت و ثبت سفارش واقعی فعال نیست.</div>
<main id="app"></main>
<footer>© کارنیل — نمونه اولیه نمایشی (بدون پرداخت و سفارش واقعی)<br><a onclick="go('admin')">پیش‌نمایش داشبورد مدیریت</a></footer>
<nav class="bn">
 <a onclick="go('home')"><b>🏠</b>خانه</a><a onclick="S.f.cat='all';S.q='';go('list')"><b>👗</b>محصولات</a>
 <a onclick="go('cart')"><b>🛍</b>سبد</a><a onclick="go('track')"><b>📦</b>پیگیری</a><a onclick="go('auth')"><b>👤</b>حساب</a>
</nav>
<script>
/* ===== داده و لایه API (در مرحله بعد با بک‌اند واقعی جایگزین می‌شود) ===== */
const P=[
{id:1,name:'پیراهن مجلسی ساتن',cat:'women',price:1850000,off:20,e:'👗',hot:1,colors:[['زرشکی','#8b2f5f'],['مشکی','#222'],['سبز','#2e6b57']],sizes:['S','M','L','XL']},
{id:2,name:'مانتو کتان تابستانه',cat:'women',price:1450000,off:0,e:'🥼',hot:1,colors:[['کرم','#d9c3a5'],['آبی','#4a6fa5']],sizes:['M','L','XL']},
{id:3,name:'بلوز حریر یقه‌ایستاده',cat:'women',price:790000,off:15,e:'👚',hot:1,colors:[['صورتی','#e58fb0'],['سفید','#eee']],sizes:['S','M','L']},
{id:4,name:'شلوار جین مام‌فیت',cat:'women',price:1120000,off:0,e:'👖',colors:[['آبی تیره','#2c3e6b'],['آبی روشن','#7fa3d1']],sizes:['S','M','L','XL']},
{id:5,name:'کت کوتاه پاییزه',cat:'women',price:2350000,off:30,e:'🧥',hot:1,colors:[['خاکی','#8a7a55'],['مشکی','#222']],sizes:['M','L']},
{id:6,name:'شال نخی طرح‌دار',cat:'women',price:380000,off:0,e:'🧣',colors:[['طلایی','#d9a441'],['سرمه‌ای','#233a6b']],sizes:['فری']},
{id:7,name:'ست تی‌شرت و شلوارک پسرانه',cat:'kids',price:640000,off:10,e:'👕',hot:1,colors:[['آبی','#4a8fd1'],['سبز','#5aa86a']],sizes:['۲ سال','۴ سال','۶ سال','۸ سال']},
{id:8,name:'سرهمی نوزادی پنبه‌ای',cat:'kids',price:450000,off:0,e:'🍼',hot:1,colors:[['زرد','#f2cf5b'],['صورتی','#f0a6c3']],sizes:['۰-۳ ماه','۳-۶ ماه','۶-۹ ماه']},
{id:9,name:'پیراهن دخترانه تور',cat:'kids',price:890000,off:25,e:'👗',hot:1,colors:[['صورتی','#e58fb0'],['یاسی','#a98bd6']],sizes:['۴ سال','۶ سال','۸ سال']},
{id:10,name:'هودی بچگانه گرم',cat:'kids',price:720000,off:0,e:'🧒',colors:[['طوسی','#8d8d95'],['قرمز','#c8403f']],sizes:['۶ سال','۸ سال','۱۰ سال']},
{id:11,name:'شلوار لی بچگانه',cat:'kids',price:560000,off:12,e:'👖',colors:[['آبی','#3f5f9a']],sizes:['۴ سال','۶ سال','۸ سال']},
{id:12,name:'جوراب بچگانه (بسته ۳ تایی)',cat:'kids',price:140000,off:0,e:'🧦',colors:[['رنگی','#e8a33d']],sizes:['فری']}];
const api={ // نقطه اتصال به بک‌اند؛ فعلاً نمایشی
 products:async()=>P,
 createOrder:async o=>({code:'KR-'+(2000+Math.floor(Math.random()*8000))}), // TODO: POST /api/orders
 startPayment:null // TODO: درگاه پرداخت (زرین‌پال/...) — هنوز فعال نیست
};
const ORDERS=[['KR-1001','سارا احمدی','۲,۳۵۰,۰۰۰','ارسال شده'],['KR-1002','نیما کریمی','۷۹۰,۰۰۰','در حال آماده‌سازی'],['KR-1003','مریم رضایی','۱,۴۵۰,۰۰۰','تحویل شده']];
/* ===== وضعیت ===== */
let saved=[];try{saved=JSON.parse(localStorage.getItem('karnil-demo-cart')||'[]')}catch(e){}
const S={view:'home',arg:null,cart:Array.isArray(saved)?saved:[],q:'',f:{cat:'all',size:'',max:2500000,sale:0},sort:'new',step:1,pick:{},addr:{ship:'post'},last:null,tab:'in'};
const fa=n=>Number(n).toLocaleString('fa-IR');
const fin=p=>Math.round(p.price*(100-p.off)/100);
const $=s=>document.querySelector(s);
const sell=p=>`<div class="pr"><b>${fa(fin(p))} تومان</b>${p.off?`<s>${fa(p.price)}</s>`:''}</div>`;
const card=p=>`<div class="card" onclick="S.pick={};go('p',${p.id})"><div class="im" style="background:linear-gradient(135deg,${p.colors[0][1]}22,${p.colors[0][1]}77)">${p.e}${p.off?`<span class="bd">٪${fa(p.off)}</span>`:''}</div><div class="ci"><div class="nm">${p.name}</div>${sell(p)}<div class="dots">${p.colors.map(c=>`<i style="background:${c[1]}"></i>`).join('')}</div></div></div>`;
function go(v,a){S.view=v;S.arg=a;if(v==='checkout'&&!a)S.step=1;r();scrollTo(0,0)}
function filt(){let l=P.filter(p=>(S.f.cat==='all'||p.cat===S.f.cat)&&(!S.q||p.name.includes(S.q))&&(!S.f.size||p.sizes.includes(S.f.size))&&fin(p)<=S.f.max&&(!S.f.sale||p.off));
 if(S.sort==='lo')l.sort((a,b)=>fin(a)-fin(b));if(S.sort==='hi')l.sort((a,b)=>fin(b)-fin(a));if(S.sort==='off')l.sort((a,b)=>b.off-a.off);return l}
const sub=()=>S.cart.reduce((t,i)=>t+fin(P.find(p=>p.id===i.id))*i.q,0);
const ship=()=>sub()>1500000||!S.cart.length?0:(S.addr.ship==='pk'?90000:60000);
/* ===== صفحه‌ها ===== */
const V={
home:()=>`<div class="ban">
 <div style="background:linear-gradient(135deg,#8b2f5f,#d27aa6)" onclick="S.f.sale=1;S.f.cat='women';go('list')"><h1>جشنواره پاییزه 🍂</h1><span>تا ٣٠٪ تخفیف روی پوشاک زنانه</span><button class="btn w">مشاهده تخفیف‌ها</button></div>
 <div style="background:linear-gradient(135deg,#e8a33d,#f0c36d);color:#2a1f26" onclick="S.f.cat='kids';go('list')"><h1>دنیای شاد بچه‌ها 🧸</h1><span>لباس راحت و نرم برای کوچولوها</span><button class="btn w">خرید بچگانه</button></div></div>
 <h2>دسته‌بندی</h2><div class="cats"><div class="cat" onclick="S.f.cat='women';go('list')"><b>👗</b>پوشاک زنانه</div><div class="cat" onclick="S.f.cat='kids';go('list')"><b>🧒</b>پوشاک بچگانه</div></div>
 <h2>پرفروش‌ترین‌ها <a onclick="S.f.cat='all';go('list')">مشاهده همه ‹</a></h2><div class="grid">${P.filter(p=>p.hot).slice(0,8).map(card).join('')}</div>
 <h2>تخفیف‌های ویژه</h2><div class="grid">${P.filter(p=>p.off>=20).map(card).join('')}</div>
 <div class="feat"><div>🚚 ارسال رایگان بالای ۱٬۵۰۰٬۰۰۰ تومان</div><div>↩️ ۷ روز ضمانت بازگشت</div><div>✅ ضمانت اصالت کالا</div><div>💬 پشتیبانی ۷ روز هفته</div></div>`,
list:()=>{const l=filt(),f=S.f;return `<div class="chips">${[['all','همه'],['women','زنانه'],['kids','بچگانه']].map(c=>`<span class="chip ${f.cat===c[0]?'on':''}" onclick="S.f.cat='${c[0]}';r()">${c[1]}</span>`).join('')}<span class="chip ${f.sale?'on':''}" onclick="S.f.sale=!S.f.sale;r()">فقط تخفیف‌دار</span></div>
 <div class="box"><div class="row"><span>مرتب‌سازی</span><select class="inp" style="width:auto;margin:0" onchange="S.sort=this.value;r()">${[['new','جدیدترین'],['lo','ارزان‌ترین'],['hi','گران‌ترین'],['off','بیشترین تخفیف']].map(o=>`<option value="${o[0]}" ${S.sort===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
 <div class="row" style="margin-top:8px"><span>سقف قیمت: ${fa(f.max)}</span><input type="range" min="100000" max="2500000" step="50000" value="${f.max}" onchange="S.f.max=+this.value;r()"></div>
 <div class="chips" style="margin-top:8px">${['','S','M','L','XL','۴ سال','۶ سال','۸ سال'].map(s=>`<span class="chip ${f.size===s?'on':''}" onclick="S.f.size='${s}';r()">${s||'همه سایزها'}</span>`).join('')}</div></div>
 <p style="color:var(--mu);margin:6px 0">${fa(l.length)} محصول${S.q?` برای «${S.q}»`:''}</p><div class="grid">${l.map(card).join('')||'<p>محصولی یافت نشد.</p>'}</div>`},
p:()=>{const p=P.find(x=>x.id===S.arg),k=S.pick;k.c=k.c??0;return `<div class="pd"><div class="im" style="background:linear-gradient(135deg,${p.colors[k.c][1]}33,${p.colors[k.c][1]}99)">${p.e}</div><div>
 <p style="color:var(--mu);font-size:13px">${p.cat==='women'?'پوشاک زنانه':'پوشاک بچگانه'}</p><h1 style="font-size:22px">${p.name}</h1><div style="margin:8px 0;font-size:18px">${sell(p)}</div>
 <p>رنگ: ${p.colors[k.c][0]}</p><div style="margin:6px 0 12px">${p.colors.map((c,i)=>`<span class="sw ${k.c===i?'on':''}" style="background:${c[1]}" onclick="S.pick.c=${i};r()"></span>`).join('')}</div>
 <p>سایز:</p><div class="chips" style="margin:6px 0 14px">${p.sizes.map(s=>`<span class="chip ${k.s===s?'on':''}" onclick="S.pick.s='${s}';r()">${s}</span>`).join('')}</div>
 <button class="btn" style="width:100%" onclick="add(${p.id})">افزودن به سبد خرید</button>
 <p style="color:var(--mu);font-size:13px;margin-top:12px">پارچه مرغوب، دوخت استاندارد، قابل‌شستشو در دمای ۳۰ درجه. (توضیحات نمایشی)</p></div></div>
 <h2>محصولات مشابه</h2><div class="grid">${P.filter(x=>x.cat===p.cat&&x.id!==p.id).slice(0,4).map(card).join('')}</div>`},
cart:()=>!S.cart.length?`<div class="box" style="text-align:center">سبد خرید شما خالی است 🛍<br><br><button class="btn" onclick="go('list')">شروع خرید</button></div>`:`<h2>سبد خرید</h2><div class="box">${S.cart.map((i,n)=>{const p=P.find(x=>x.id===i.id);return `<div class="ci2"><div class="im" style="background:${p.colors[i.c][1]}55">${p.e}</div><div style="flex:1"><div class="nm">${p.name}</div><small style="color:var(--mu)">${p.colors[i.c][0]} | ${i.s}</small>${sell(p)}</div><div class="q"><button onclick="qty(${n},1)">+</button> ${fa(i.q)} <button onclick="qty(${n},-1)">−</button></div></div>`}).join('')}</div>${sum()}<button class="btn" style="width:100%" onclick="go('checkout')">ادامه و ثبت سفارش</button>`,
checkout:()=>{const a=S.addr,st=S.step;return `<div class="steps">${['اطلاعات','ارسال','پرداخت'].map((t,i)=>`<span class="${st===i+1?'on':''}">${fa(i+1)}. ${t}</span>`).join('')}</div>`+(!S.cart.length?'<div class="box">سبد خالی است.</div>':st===1?`<div class="box">${[['n','نام و نام خانوادگی'],['m','شماره موبایل'],['a','آدرس کامل'],['z','کد پستی']].map(x=>`<label>${x[1]}</label><input class="inp" value="${a[x[0]]||''}" oninput="S.addr.${x[0]}=this.value">`).join('')}<button class="btn" style="width:100%" onclick="S.step=2;r()">مرحله بعد</button></div>`:st===2?`<div class="box">${[['post','پست پیشتاز (۳ تا ۵ روز) — ۶۰٬۰۰۰ تومان'],['pk','پیک (همان روز، فقط شهرهای بزرگ) — ۹۰٬۰۰۰ تومان']].map(x=>`<label style="display:block;padding:8px 0"><input type="radio" name="s" ${a.ship===x[0]?'checked':''} onchange="S.addr.ship='${x[0]}'"> ${x[1]}</label>`).join('')}<small style="color:var(--mu)">ارسال بالای ۱٬۵۰۰٬۰۰۰ تومان رایگان است.</small><br><br><button class="btn" style="width:100%" onclick="S.step=3;r()">مرحله بعد</button></div>`:`${sum()}<div class="note">⚠️ درگاه پرداخت هنوز متصل نیست. این دکمه فقط یک سفارش آزمایشی می‌سازد و هیچ مبلغی دریافت نمی‌شود.</div><div class="box"><b>درگاه پرداخت</b><div class="chips" style="margin-top:8px"><span class="chip" style="opacity:.5">زرین‌پال (به‌زودی)</span><span class="chip" style="opacity:.5">آی‌دی‌پی (به‌زودی)</span><span class="chip" style="opacity:.5">شاپرک (به‌زودی)</span></div></div><button class="btn" style="width:100%" onclick="place()">ثبت سفارش آزمایشی</button>`)},
done:()=>`<div class="box" style="text-align:center"><div style="font-size:50px">🎉</div><h2 style="justify-content:center">سفارش آزمایشی ثبت شد</h2><p>کد پیگیری نمایشی: <b>${S.last}</b></p><br><button class="btn" onclick="go('track')">پیگیری سفارش</button></div>`,
auth:()=>`<div class="box" style="max-width:420px;margin:auto"><div class="chips"><span class="chip ${S.tab==='in'?'on':''}" onclick="S.tab='in';r()">ورود</span><span class="chip ${S.tab==='up'?'on':''}" onclick="S.tab='up';r()">ثبت‌نام</span></div><br>${S.tab==='up'?'<label>نام و نام خانوادگی</label><input class="inp">':''}<label>شماره موبایل</label><input class="inp" inputmode="numeric" placeholder="۰۹۱۲۳۴۵۶۷۸۹" dir="ltr"><label>کد تأیید پیامکی</label><input class="inp" inputmode="numeric" dir="ltr"><div class="note">نمونه نمایشی؛ ورود واقعی با OTP پیامکی در مرحله بک‌اند اضافه می‌شود.</div><button class="btn" style="width:100%" onclick="alert('این فرم هنوز به سرور متصل نیست.')">${S.tab==='in'?'ورود':'ایجاد حساب'}</button></div>`,
track:()=>{const c=(S.arg||'').trim().toUpperCase(),ok=c==='KR-1001'||c===S.last;return `<h2>پیگیری سفارش</h2><div class="box"><label>کد سفارش</label><input class="inp" id="tc" dir="ltr" placeholder="KR-1001" value="${S.arg||''}"><button class="btn" onclick="go('track',$('#tc').value||' ')">پیگیری</button></div>`+(c?ok?`<div class="box"><b>سفارش ${c}</b><div class="tl" style="margin-top:10px"><div class="d">ثبت سفارش</div><div class="d">تأیید و پرداخت</div><div class="d">آماده‌سازی</div><div>ارسال با پست</div><div>تحویل به مشتری</div></div></div>`:'<div class="box">سفارشی با این کد پیدا نشد. (نمونه: KR-1001)</div>':'')},
admin:()=>`<h2>داشبورد مدیریت <small style="color:var(--mu);font-weight:400">(طرح اولیه، داده نمایشی)</small></h2><div class="note">این بخش فقط طراحی ظاهری است و هنوز احراز هویت یا پایگاه داده ندارد.</div>
 <div class="st"><div>فروش امروز<b>${fa(12400000)}</b></div><div>سفارش جدید<b>${fa(18)}</b></div><div>محصولات کم‌موجودی<b>${fa(4)}</b></div><div>مشتریان<b>${fa(326)}</b></div></div>
 <h2>فروش هفته</h2><div class="box"><div class="bars">${[40,65,50,80,95,70,100].map(h=>`<i style="height:${h}%"></i>`).join('')}</div></div>
 <h2>آخرین سفارش‌ها</h2><div class="box scr"><table><tr><th>کد</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th></tr>${ORDERS.map(o=>`<tr>${o.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>
 <h2>موجودی</h2><div class="box scr"><table><tr><th>محصول</th><th>قیمت</th><th>موجودی</th></tr>${P.slice(0,5).map((p,i)=>`<tr><td>${p.name}</td><td>${fa(p.price)}</td><td>${fa([14,3,22,8,2][i])}</td></tr>`).join('')}</table></div>`
};
function sum(){const s=sub(),h=ship();return `<div class="box"><div class="row"><span>جمع کالاها</span><span>${fa(s)} تومان</span></div><div class="row"><span>هزینه ارسال</span><span>${h?fa(h)+' تومان':'رایگان'}</span></div><hr style="border:0;border-top:1px solid var(--br);margin:8px 0"><div class="row"><b>مبلغ قابل پرداخت</b><b style="color:var(--p)">${fa(s+h)} تومان</b></div></div>`}
function add(id){const p=P.find(x=>x.id===id),k=S.pick;if(!k.s)return alert('لطفاً سایز را انتخاب کنید.');const c=k.c||0,e=S.cart.find(i=>i.id===id&&i.c===c&&i.s===k.s);e?e.q++:S.cart.push({id,c,s:k.s,q:1});go('cart')}
function qty(n,d){S.cart[n].q+=d;if(S.cart[n].q<1)S.cart.splice(n,1);r()}
async function place(){const o=await api.createOrder({items:S.cart,addr:S.addr});S.last=o.code;S.cart=[];go('done')}
function r(){try{localStorage.setItem('karnil-demo-cart',JSON.stringify(S.cart))}catch(e){}
$('#app').innerHTML=V[S.view]();$('#cc').textContent=fa(S.cart.reduce((t,i)=>t+i.q,0))}
r();
</script>
</body>
</html>
